name: Materialize CopilotKit foundation

on:
  push:
    branches:
      - feat/copilotkit-foundation
    paths:
      - '.copilotkit-payload/**'
      - '.github/workflows/materialize-copilotkit.yml'

permissions:
  contents: write

concurrency:
  group: materialize-copilotkit-foundation
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/copilotkit-foundation
          fetch-depth: 0

      - name: Decode and apply the CopilotKit foundation
        shell: bash
        run: |
          set -euo pipefail
          cat .copilotkit-payload/* | base64 --decode > /tmp/copilotkit-foundation.tar.gz
          tar -xzf /tmp/copilotkit-foundation.tar.gz
          rm -rf .copilotkit-payload
          rm -f .github/workflows/materialize-copilotkit.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add CopilotKit v2 foundation"
          git push origin HEAD:feat/copilotkit-foundation
