name: Deploy HarnessLab to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/copilotkit-web/**'
      - 'services/copilotkit-runtime/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.copilotkit.config.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: harnesslab-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy / GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pinned CopilotKit build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate HarnessLab contracts
        run: npm run check

      - name: Build the CopilotKit workspace into the Pages package
        run: npm run build:copilot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record deployed URL
        shell: bash
        run: |
          {
            echo '### HarnessLab Pages deployment'
            echo
            echo "Published the validated builder and CopilotKit workspace to:"
            echo
            echo "${{ steps.deployment.outputs.page_url }}"
            echo
            echo "CopilotKit route: ${{ steps.deployment.outputs.page_url }}copilot/"
          } >> "$GITHUB_STEP_SUMMARY"
