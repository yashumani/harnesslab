name: Verify HarnessLab Pages

on:
  workflow_run:
    workflows:
      - Deploy HarnessLab to Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-harnesslab-pages
  cancel-in-progress: true

jobs:
  verify-live:
    name: Pages / live
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the public anomaly-product HarnessLab control room
        shell: bash
        env:
          BASE_URL: https://yashumani.github.io/harnesslab
        run: |
          set -euo pipefail

          ready=false
          for attempt in {1..36}; do
            echo "Live verification attempt ${attempt}/36"
            if curl --fail --silent --show-error --location --max-time 20 \
              "${BASE_URL}/?verify=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/harnesslab-live-index.html; then
              if grep -q 'HarnessLab — Agent Harness Control Room' /tmp/harnesslab-live-index.html \
                && grep -q 'id="root"' /tmp/harnesslab-live-index.html \
                && grep -q 'react@18.3.1' /tmp/harnesslab-live-index.html \
                && grep -q 'href="./anomaly-ui.css"' /tmp/harnesslab-live-index.html \
                && grep -q 'href="./anomaly-mobile.css"' /tmp/harnesslab-live-index.html \
                && grep -q 'src="./anomaly-shell.js"' /tmp/harnesslab-live-index.html \
                && grep -q 'src="./critic-console.js"' /tmp/harnesslab-live-index.html; then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [[ "${ready}" != 'true' ]]; then
            echo 'The public route did not serve the expected anomaly-product HarnessLab control room.'
            sed -n '1,100p' /tmp/harnesslab-live-index.html 2>/dev/null || true
            exit 1
          fi

          if grep -q 'neuronest-theme.css' /tmp/harnesslab-live-index.html; then
            echo 'The superseded NeuroNest theme is still active on the public page.'
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/app.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-app.js
          grep -q 'ReactDomRuntime.createRoot' /tmp/harnesslab-live-app.js
          grep -q 'No provider keys in browser' /tmp/harnesslab-live-app.js
          grep -qi 'planned, not executed' /tmp/harnesslab-live-app.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/anomaly-shell.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-anomaly-shell.js
          grep -q 'HARNESSLAB_PALETTES' /tmp/harnesslab-live-anomaly-shell.js
          grep -q 'harnesslab.anomaly-palette.v1' /tmp/harnesslab-live-anomaly-shell.js
          grep -q 'Design → Validate → Deploy → Observe → Improve' /tmp/harnesslab-live-anomaly-shell.js
          grep -q 'harnesslab-theme-picker' /tmp/harnesslab-live-anomaly-shell.js
          grep -q 'data.uiOverflow' /tmp/harnesslab-live-anomaly-shell.js
          test "$(grep -o "id: '[^']*'" /tmp/harnesslab-live-anomaly-shell.js | wc -l | tr -d ' ')" = '18'

          for palette in midnight slate warm light verizon att tmobile nvidia meta google cfo-navy emerald copper royal solar arctic plum monochrome; do
            grep -q "id: '${palette}'" /tmp/harnesslab-live-anomaly-shell.js
          done

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/anomaly-ui.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-anomaly.css
          grep -q 'yashumani/drill-down-anamoly' /tmp/harnesslab-live-anomaly.css
          grep -q 'AGENT HARNESS CONTROL ROOM' /tmp/harnesslab-live-anomaly.css
          grep -q '.theme-picker-menu' /tmp/harnesslab-live-anomaly.css
          grep -q '.development-cycle' /tmp/harnesslab-live-anomaly.css
          grep -q '.mission-hero' /tmp/harnesslab-live-anomaly.css
          grep -q '.workspace-layout' /tmp/harnesslab-live-anomaly.css
          grep -q '.runtime-panel' /tmp/harnesslab-live-anomaly.css
          grep -q '.composer-panel' /tmp/harnesslab-live-anomaly.css
          grep -q '.architecture-map' /tmp/harnesslab-live-anomaly.css
          grep -q '.agent-card' /tmp/harnesslab-live-anomaly.css
          grep -q '.permission-table' /tmp/harnesslab-live-anomaly.css
          grep -q '.trace-entry' /tmp/harnesslab-live-anomaly.css
          grep -q 'harnesslab-critic-console' /tmp/harnesslab-live-anomaly.css
          grep -q 'html\[data-theme="cfo-navy"\]' /tmp/harnesslab-live-anomaly.css
          grep -q 'html\[data-theme="monochrome"\]' /tmp/harnesslab-live-anomaly.css
          grep -q 'prefers-reduced-motion' /tmp/harnesslab-live-anomaly.css

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/anomaly-mobile.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-anomaly-mobile.css
          grep -q '@media (max-width: 640px)' /tmp/harnesslab-live-anomaly-mobile.css
          grep -q '@media (max-width: 390px)' /tmp/harnesslab-live-anomaly-mobile.css
          grep -q 'grid-template-areas:' /tmp/harnesslab-live-anomaly-mobile.css
          grep -q 'min-height: 44px' /tmp/harnesslab-live-anomaly-mobile.css
          grep -q 'overflow-x: clip' /tmp/harnesslab-live-anomaly-mobile.css

          if grep -Eqi 'url[[:space:]]*\([[:space:]]*["'"']?https?:|data:image/' /tmp/harnesslab-live-anomaly.css /tmp/harnesslab-live-anomaly-mobile.css; then
            echo 'The public visual system must not embed remote background artwork or data images.'
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/critic-console.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-critic.js
          grep -q 'HarnessLabCriticConsole' /tmp/harnesslab-live-critic.js
          grep -q 'One worker' /tmp/harnesslab-live-critic.js
          grep -q 'One provider call' /tmp/harnesslab-live-critic.js
          grep -q 'No tools' /tmp/harnesslab-live-critic.js
          grep -q 'No child agents' /tmp/harnesslab-live-critic.js
          grep -q 'No external actions' /tmp/harnesslab-live-critic.js
          grep -q 'harnesslab:critic-result' /tmp/harnesslab-live-critic.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/critic-client.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-critic-client.js
          grep -q '/v1/critique' /tmp/harnesslab-live-critic-client.js
          grep -q 'WORKER_REQUIRES_GATEWAY' /tmp/harnesslab-live-critic-client.js
          if grep -qi 'authorization:' /tmp/harnesslab-live-critic-client.js; then
            echo 'The public critic client must not construct provider authorization.'
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/temporary-worker-contract.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-worker-contract.js
          grep -q 'callBudget must equal 1' /tmp/harnesslab-live-worker-contract.js
          grep -q 'tools must be an empty array' /tmp/harnesslab-live-worker-contract.js
          grep -q 'childSpawning must be false' /tmp/harnesslab-live-worker-contract.js
          grep -q 'externalActions must be false' /tmp/harnesslab-live-worker-contract.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/critic-console.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-critic.css
          grep -q '.critic-drawer' /tmp/harnesslab-live-critic.css
          grep -q '.finding-card' /tmp/harnesslab-live-critic.css
          grep -q '@media (max-width: 760px)' /tmp/harnesslab-live-critic.css
          grep -q 'prefers-reduced-motion' /tmp/harnesslab-live-critic.css

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/manifest.webmanifest?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-manifest.json
          grep -q 'HarnessLab' /tmp/harnesslab-live-manifest.json

          {
            echo '### Live HarnessLab verification'
            echo
            echo "Verified the anomaly-product HarnessLab control room at ${BASE_URL}/"
            echo
            echo '- No-build React application: verified'
            echo '- Product-owned anomaly visual system: verified'
            echo '- 18 Editorial, Brand-inspired, and Executive palettes: verified'
            echo '- Desktop/tablet/phone CSS contracts: verified'
            echo '- Deploy-first development cycle: verified'
            echo '- Executable bounded critic console: verified'
            echo '- One-worker / one-call / no-tools contract: verified'
            echo '- No remote visual artwork or browser provider credential: verified'
          } >> "$GITHUB_STEP_SUMMARY"
