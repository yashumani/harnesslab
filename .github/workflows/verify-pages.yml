name: Verify HarnessLab Pages

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-harnesslab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    name: Pages / live
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify the public no-build React command center
        shell: bash
        run: |
          set -euo pipefail
          base_url='https://yashumani.github.io/harnesslab'

          ready=false
          for attempt in {1..24}; do
            echo "Live verification attempt ${attempt}/24"
            if curl --fail --silent --show-error --location --max-time 15 \
              "${base_url}/" -o /tmp/harnesslab-live-index.html; then
              if grep -q 'HarnessLab — Agent Systems Command Center' /tmp/harnesslab-live-index.html \
                && grep -q 'id="root"' /tmp/harnesslab-live-index.html \
                && grep -q 'react@18.3.1' /tmp/harnesslab-live-index.html; then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [[ "${ready}" != 'true' ]]; then
            echo 'The public route did not serve the expected React command center.'
            sed -n '1,80p' /tmp/harnesslab-live-index.html 2>/dev/null || true
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${base_url}/app.js" -o /tmp/harnesslab-live-app.js
          grep -q 'ReactDomRuntime.createRoot' /tmp/harnesslab-live-app.js
          grep -q 'No provider keys in browser' /tmp/harnesslab-live-app.js
          grep -qi 'planned, not executed' /tmp/harnesslab-live-app.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${base_url}/react-app.css" -o /tmp/harnesslab-live-react.css
          grep -q '.architecture-map' /tmp/harnesslab-live-react.css
          grep -q '.agent-card-grid' /tmp/harnesslab-live-react.css
          grep -q '@media (max-width: 760px)' /tmp/harnesslab-live-react.css

          echo "Verified live HarnessLab React command center at ${base_url}/"
