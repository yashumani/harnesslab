name: Verify HarnessLab Pages

on:
  workflow_run:
    workflows:
      - Deploy HarnessLab to Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-harnesslab-pages-live
  cancel-in-progress: true

jobs:
  verify-live:
    name: Pages / live
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the public no-build React product workspace
        shell: bash
        env:
          BASE_URL: https://yashumani.github.io/harnesslab
        run: |
          set -euo pipefail

          ready=false
          for attempt in {1..36}; do
            echo "Live verification attempt ${attempt}/36"
            if curl --fail --silent --show-error --location --max-time 20 \
              "${BASE_URL}/?verify=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/harnesslab-live-index.html; then
              if grep -q 'HarnessLab — AI Agent Harness Builder' /tmp/harnesslab-live-index.html \
                && grep -q 'id="root"' /tmp/harnesslab-live-index.html \
                && grep -q 'react@18.3.1' /tmp/harnesslab-live-index.html \
                && grep -q 'href="./taskzen-theme.css"' /tmp/harnesslab-live-index.html \
                && grep -q 'href="./taskzen-responsive.css"' /tmp/harnesslab-live-index.html \
                && grep -q 'src="./taskzen-shell.js"' /tmp/harnesslab-live-index.html \
                && grep -q 'src="./critic-console.js"' /tmp/harnesslab-live-index.html; then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [[ "${ready}" != 'true' ]]; then
            echo 'The public route did not serve the expected Taskzen-inspired React product workspace.'
            sed -n '1,120p' /tmp/harnesslab-live-index.html 2>/dev/null || true
            exit 1
          fi

          if grep -q 'neuronest-theme.css' /tmp/harnesslab-live-index.html; then
            echo 'The public site still references the superseded theme.'
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/app.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-app.js
          grep -q 'ReactDomRuntime.createRoot' /tmp/harnesslab-live-app.js
          grep -q 'No provider keys in browser' /tmp/harnesslab-live-app.js
          grep -qi 'planned, not executed' /tmp/harnesslab-live-app.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/taskzen-theme.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-taskzen.css
          grep -qi -- '--bg-0: #f7f8fc' /tmp/harnesslab-live-taskzen.css
          grep -qi -- '--cyan: #635bff' /tmp/harnesslab-live-taskzen.css
          grep -qi -- '--teal: #0e9384' /tmp/harnesslab-live-taskzen.css
          grep -q '.mission-hero' /tmp/harnesslab-live-taskzen.css
          grep -q '.workspace-layout' /tmp/harnesslab-live-taskzen.css
          grep -q '.runtime-panel' /tmp/harnesslab-live-taskzen.css
          grep -q '.composer-panel' /tmp/harnesslab-live-taskzen.css
          grep -q '.architecture-map' /tmp/harnesslab-live-taskzen.css
          grep -q '.permission-table' /tmp/harnesslab-live-taskzen.css
          grep -q '@media (max-width: 1120px)' /tmp/harnesslab-live-taskzen.css
          grep -q '@media (max-width: 760px)' /tmp/harnesslab-live-taskzen.css
          grep -q 'prefers-reduced-motion' /tmp/harnesslab-live-taskzen.css

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/taskzen-responsive.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-taskzen-responsive.css
          grep -q '.result-tabs' /tmp/harnesslab-live-taskzen-responsive.css
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr))' /tmp/harnesslab-live-taskzen-responsive.css
          grep -q 'white-space: normal' /tmp/harnesslab-live-taskzen-responsive.css

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/taskzen-shell.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-taskzen-shell.js
          grep -q "const DESIGN_ID = 'taskzen'" /tmp/harnesslab-live-taskzen-shell.js
          grep -q 'const DRAWER_BREAKPOINT = 1120' /tmp/harnesslab-live-taskzen-shell.js
          grep -q 'setInert(sidebar, true)' /tmp/harnesslab-live-taskzen-shell.js
          grep -q "sidebar.setAttribute('aria-hidden', 'true')" /tmp/harnesslab-live-taskzen-shell.js
          grep -q 'setInert(main, true)' /tmp/harnesslab-live-taskzen-shell.js
          grep -q "sidebar.setAttribute('aria-modal', 'true')" /tmp/harnesslab-live-taskzen-shell.js
          grep -q "event.key === 'Escape'" /tmp/harnesslab-live-taskzen-shell.js
          grep -q 'dataset.uiOverflow' /tmp/harnesslab-live-taskzen-shell.js
          grep -q 'ui-audit-output' /tmp/harnesslab-live-taskzen-shell.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/react-app.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-react.css
          grep -q '.architecture-map' /tmp/harnesslab-live-react.css
          grep -q '.agent-card-grid' /tmp/harnesslab-live-react.css

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/critic-console.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-critic.js
          grep -q 'HarnessLabCriticConsole' /tmp/harnesslab-live-critic.js
          grep -q 'One worker' /tmp/harnesslab-live-critic.js
          grep -q 'One provider call' /tmp/harnesslab-live-critic.js
          grep -q 'No tools' /tmp/harnesslab-live-critic.js
          grep -q 'No child agents' /tmp/harnesslab-live-critic.js
          grep -q 'No external actions' /tmp/harnesslab-live-critic.js
          grep -q 'harnesslab:critic-result' /tmp/harnesslab-live-critic.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/critic-client.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-critic-client.js
          grep -q '/v1/critique' /tmp/harnesslab-live-critic-client.js
          grep -q 'WORKER_REQUIRES_GATEWAY' /tmp/harnesslab-live-critic-client.js
          if grep -qi 'authorization:' /tmp/harnesslab-live-critic-client.js; then
            echo 'The public critic client must not construct provider authorization.'
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/temporary-worker-contract.js?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-worker-contract.js
          grep -q 'callBudget must equal 1' /tmp/harnesslab-live-worker-contract.js
          grep -q 'tools must be an empty array' /tmp/harnesslab-live-worker-contract.js
          grep -q 'childSpawning must be false' /tmp/harnesslab-live-worker-contract.js
          grep -q 'externalActions must be false' /tmp/harnesslab-live-worker-contract.js

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/critic-console.css?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-critic.css
          grep -q '.critic-drawer' /tmp/harnesslab-live-critic.css
          grep -q '.finding-card' /tmp/harnesslab-live-critic.css
          grep -qi -- '--critic-cyan: #635bff' /tmp/harnesslab-live-critic.css
          grep -q '@media (max-width: 760px)' /tmp/harnesslab-live-critic.css
          grep -q 'prefers-reduced-motion' /tmp/harnesslab-live-critic.css

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/manifest.webmanifest?verify=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-live-manifest.json
          grep -q 'HarnessLab' /tmp/harnesslab-live-manifest.json
          grep -qi '#F7F8FC' /tmp/harnesslab-live-manifest.json
          grep -qi '#635BFF' /tmp/harnesslab-live-manifest.json

          {
            echo '### Live HarnessLab verification'
            echo
            echo "Verified the deployed Taskzen-inspired no-build React workspace at ${BASE_URL}/"
            echo
            echo '- Product HTML, pinned React runtime, Taskzen theme, responsive layer, and shell: verified'
            echo '- Light indigo/teal product design and responsive selectors: verified'
            echo '- Responsive drawer inertness, dialog semantics, Escape handling, and focus contract: verified'
            echo '- Superseded theme reference: absent'
            echo '- Executable bounded critic console: verified'
            echo '- One-worker / one-call / no-tools contract: verified'
            echo '- Web app manifest: verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the verified live deployment
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
          VERIFY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 29 --repo "${GITHUB_REPOSITORY}" --body "$(cat <<EOF
          <!-- harnesslab-live-verification -->
          ## Live deployment verified

          The public HarnessLab release at https://yashumani.github.io/harnesslab/ passed post-deployment verification.

          - Deployed commit: \`${DEPLOYED_SHA}\`
          - Taskzen theme and responsive assets: verified
          - Closed drawer inert and hidden from assistive technology: verified
          - Open drawer dialog semantics and background inertness: verified
          - Escape/focus-management implementation: verified
          - Superseded NeuroNest asset: absent
          - Bounded critic and browser credential boundary: verified
          - Deployment workflow: ${DEPLOY_RUN_URL}
          - Verification workflow: ${VERIFY_RUN_URL}
          EOF
          )"
