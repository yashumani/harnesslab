name: Verify HarnessLab Taskzen Design

on:
  pull_request:
    paths:
      - '.github/workflows/verify-design-theme.yml'
  workflow_run:
    workflows:
      - Deploy HarnessLab to Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-harnesslab-taskzen-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-theme:
    name: Design / live
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the public Taskzen-inspired product design
        shell: bash
        env:
          BASE_URL: https://yashumani.github.io/harnesslab
        run: |
          set -euo pipefail

          ready=false
          for attempt in {1..36}; do
            echo "Design verification attempt ${attempt}/36"
            if curl --fail --silent --show-error --location --max-time 20 \
              "${BASE_URL}/?theme=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/harnesslab-theme-index.html; then
              if grep -q 'href="./taskzen-theme.css"' /tmp/harnesslab-theme-index.html \
                && grep -q 'src="./taskzen-shell.js"' /tmp/harnesslab-theme-index.html; then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [[ "${ready}" != 'true' ]]; then
            echo 'The public route did not load the Taskzen-inspired HarnessLab design.'
            sed -n '1,120p' /tmp/harnesslab-theme-index.html 2>/dev/null || true
            exit 1
          fi

          if grep -q 'neuronest-theme.css' /tmp/harnesslab-theme-index.html; then
            echo 'The public route still references the superseded design.'
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/taskzen-theme.css?theme=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-taskzen-theme.css
          curl --fail --silent --show-error --location --max-time 20 \
            "${BASE_URL}/taskzen-shell.js?theme=${GITHUB_RUN_ID}" \
            -o /tmp/harnesslab-taskzen-shell.js

          grep -qi 'original HarnessLab implementation' /tmp/harnesslab-taskzen-theme.css
          grep -qi '#f7f8fc' /tmp/harnesslab-taskzen-theme.css
          grep -qi '#635bff' /tmp/harnesslab-taskzen-theme.css
          grep -qi '#0e9384' /tmp/harnesslab-taskzen-theme.css
          grep -q '.sidebar' /tmp/harnesslab-taskzen-theme.css
          grep -q '.mission-hero' /tmp/harnesslab-taskzen-theme.css
          grep -q '.workspace-layout' /tmp/harnesslab-taskzen-theme.css
          grep -q '.runtime-panel' /tmp/harnesslab-taskzen-theme.css
          grep -q '.composer-panel' /tmp/harnesslab-taskzen-theme.css
          grep -q '.architecture-map' /tmp/harnesslab-taskzen-theme.css
          grep -q '.agent-card-grid' /tmp/harnesslab-taskzen-theme.css
          grep -q '.permission-table' /tmp/harnesslab-taskzen-theme.css
          grep -q '.trace-timeline' /tmp/harnesslab-taskzen-theme.css
          grep -q '@media (max-width: 1120px)' /tmp/harnesslab-taskzen-theme.css
          grep -q '@media (max-width: 760px)' /tmp/harnesslab-taskzen-theme.css
          grep -q 'prefers-reduced-motion' /tmp/harnesslab-taskzen-theme.css
          grep -q "const DESIGN_ID = 'taskzen'" /tmp/harnesslab-taskzen-shell.js
          grep -q 'dataset.uiOverflow' /tmp/harnesslab-taskzen-shell.js

          if grep -Eqi 'url[[:space:]]*\([[:space:]]*["'\'' ]?https?:|data:image/' /tmp/harnesslab-taskzen-theme.css; then
            echo 'The original design must not embed remote artwork or data-image assets.'
            exit 1
          fi

          {
            echo '### HarnessLab visual verification'
            echo
            echo "Verified the deployed Taskzen-inspired product design at ${BASE_URL}/"
            echo
            echo '- Original HarnessLab visual stylesheet: verified'
            echo '- Light canvas with indigo and teal semantic accents: verified'
            echo '- Navigation, hero, workspace, runtime, architect, result, and evidence selectors: verified'
            echo '- Tablet, phone, focus, and reduced-motion behavior: verified'
            echo '- Superseded theme and external template artwork: absent'
          } >> "$GITHUB_STEP_SUMMARY"
