name: Assemble Open WebUI-inspired workspace

on:
  push:
    branches:
      - feat/openwebui-workspace-shell
    paths:
      - '.openwebui-payload/**'

permissions:
  contents: write

concurrency:
  group: assemble-openwebui-workspace
  cancel-in-progress: true

jobs:
  assemble:
    name: Workspace / assemble
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/openwebui-workspace-shell
          fetch-depth: 0

      - name: Decode, validate, and commit the workspace files
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.openwebui-payload/payload.part*' > /dev/null; then
            echo 'The workspace payload has already been assembled.'
            exit 0
          fi

          cat .openwebui-payload/payload.part* > /tmp/openwebui-workspace.b64
          base64 --decode /tmp/openwebui-workspace.b64 > /tmp/openwebui-workspace.tar.gz
          tar -tzf /tmp/openwebui-workspace.tar.gz
          tar -xzf /tmp/openwebui-workspace.tar.gz -C .
          rm -rf .openwebui-payload

          node --check apps/web/app.js
          node --check tests/openwebui-workspace-shell.test.mjs
          test -s apps/web/openwebui-theme.css
          grep -q 'data-ui-pattern="openwebui"' apps/web/app.js
          grep -q 'href="./openwebui-theme.css"' apps/web/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace the website with an Open WebUI-inspired workspace'
          git push origin HEAD:feat/openwebui-workspace-shell
